services:
  mongodb:
    image: mongo:7.0
    container_name: chatter-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: 802282
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - chatter-network
    restart: unless-stopped

  chatter-backend:
    image: chatter-backend:2.0
    container_name: chatter-backend
    env_file:
      - ./backend/.env
    depends_on:
      - mongodb
    networks:
      - chatter-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatter-backend.rule=Host(`chatter-api.vedantd.in`)"

      - "traefik.http.routers.chatter-backend.entrypoints=web"
      - "traefik.http.routers.chatter-backend.middlewares=chatter-rate-limit@docker"
      - "traefik.docker.network=chatter-network"
      - "traefik.http.services.chatter-backend.loadbalancer.server.port=4000"

      #Rate Limiting
      - "traefik.http.middlewares.chatter-rate-limit.ratelimit.average=100"
      - "traefik.http.middlewares.chatter-rate-limit.ratelimit.burst=50"
    restart: unless-stopped

  chatter-frontend:
    image: chatter-frontend:latest
    container_name: chatter-frontend
    env_file:
      - ./frontend/.env
    networks:
      - chatter-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.chatter.rule=Host(`chatter.vedantd.in`)"

      - "traefik.http.routers.chatter.entrypoints=web"
      - "traefik.http.routers.chatter.middlewares=chatter-security-headers@docker"
      - "traefik.http.services.chatter.loadbalancer.server.port=80"
      - "traefik.docker.network=chatter-network"

      #Security headers
      - "traefik.http.middlewares.chatter-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.chatter-security-headers.headers.frameDeny=true"
      - "traefik.http.middlewares.chatter-security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.chatter-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
    restart: unless-stopped

volumes:
  mongodb_data:

networks:
  chatter-network:
    external: true

